<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador De Triplos y Cuádruplos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

  <div class="container py-5">
    <h1 class="text-center mb-4 text-neon">Generar Triplos y Cuádruplos</h1>

    <div id="alertas"></div>

    <div class="input-group mb-3">
      <input type="text" id="expresion" class="form-control" placeholder="Ejemplo: res = (a + b) * (c + d) - e / f">
      <button class="btn btn-primary" onclick="calcular()">Calcular</button>
      <button class="btn btn-danger" onclick="limpiar()">Limpiar</button>
    </div>

    <div class="card bg-secondary text-light mb-3">
      <div class="card-body">
        <h2 class="card-title">Triplos</h2>
        <table class="table table-dark table-striped table-hover" id="tabla-triplos">
          <thead>
            <tr>
              <th>#</th><th>Operador</th><th>Operando1</th><th>Operando2</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <h2 class="card-title">Cuádruplos</h2>
        <table class="table table-dark table-striped table-hover" id="tabla-cuadruplos">
          <thead>
            <tr>
              <th>#</th><th>Operador</th><th>Operando1</th><th>Operando2</th><th>Resultado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <h2 class="card-title">Código JS</h2>
        <pre id="codigo" class="bg-dark text-success p-3 rounded"></pre>

        <h2 class="card-title">Resultado</h2>
        <pre id="resultado" class="bg-dark text-warning p-3 rounded"></pre>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
